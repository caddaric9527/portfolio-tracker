name: Bug 报告
description: 页面、计算、部署出了问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先跑一遍 `bash check-deploy.sh`，六段自检能定位大部分部署问题。
        安全问题请不要在这里提，见 [SECURITY.md](../blob/main/SECURITY.md)。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句话说清现象，比如「组合卡收益率显示 0% 但实际有收益」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入主页
        2. 点「录入本月数据」，选组合一，月份填 2026-02
        3. 投入 1000，市值 1050，保存
        4. 组合卡收益率显示 ——
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 部署方式
      options:
        - Docker Compose（NAS）
        - Docker Compose（普通 Linux）
        - 本地 npm start
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 仓库根目录 `VERSION` 文件的内容，或镜像 tag
      placeholder: 2026.11.15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        `docker compose logs --tail=50` 的输出，或浏览器控制台报错。
        **提交前请把密码、IP、真实金额糊掉。**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已运行 `bash check-deploy.sh` 并把 `[FAIL]` 项贴在上面的日志里
        - label: 我确认日志与截图里没有密码、真实持仓金额和内网 IP
